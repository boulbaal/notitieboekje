<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Notitieboekje</title>
<meta name="description" content="A little yellow notebook. Everything stays on your device. No account, no ads, free.">
<meta name="theme-color" content="#d8d2c6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notitieboekje">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="canonical" href="https://notitieboekje.vanali.workers.dev/">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Notitieboekje">
<meta property="og:title" content="Notitieboekje">
<meta property="og:description" content="A little yellow notebook. Everything stays on your device. No account, no ads, free.">
<meta property="og:url" content="https://notitieboekje.vanali.workers.dev/">
<meta property="og:image" content="https://notitieboekje.vanali.workers.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/style.css">
<script src="/i18n.js" defer></script>
<script src="/import.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<main class="bureau" id="bureau">
  <div class="blok" id="blok">
    <div class="bladen" id="bladen">

      <!-- Beginpagina: de lijst van je blaadjes -->
      <section class="pagina begin" id="begin" aria-labelledby="titel">
        <header class="kop">
          <h1 id="titel">Notitieboekje</h1>
          <button class="plus" id="plus" type="button" aria-label="New page" title="New page">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 4.5v15M4.5 12h15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </header>
        <div class="lijnen lijstvak" id="lijstvak">
          <ul class="lijst" id="lijst" aria-label="Your pages" aria-describedby="lijstHulp"></ul>
          <p class="leeg" id="leeg" hidden></p>
          <p class="hint" id="hint" hidden></p>
          <p class="sr" id="lijstHulp"></p>
        </div>
        <aside class="installeer" id="installeer" aria-labelledby="installTitel" hidden>
          <svg class="paperclip" viewBox="0 0 16 44" width="16" height="44" aria-hidden="true"><path d="M5.5 30V9.5a3.5 3.5 0 0 1 7 0V33a5.5 5.5 0 0 1-11 0V12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <img class="installeer-icoon" src="/icon-192.png" alt="" width="42" height="42">
          <div class="installeer-tekst">
            <p class="installeer-titel" id="installTitel">Put the notebook on your phone</p>
            <p class="installeer-uitleg" id="installUitleg" hidden></p>
            <button class="installeer-knop" id="installKnop" type="button" hidden>Install</button>
          </div>
          <button class="installeer-dicht" id="installDicht" type="button" aria-label="Close" title="Close">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </aside>
        <footer class="voet" id="voet">
          <button class="voetknop" id="doneerKnop" type="button" aria-expanded="false" aria-controls="doneerPaneel">Donate</button>
          <button class="voetknop meer" id="meerKnop" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="meerMenu" aria-label="More" title="More">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></g></svg>
          </button>
          <span class="stip" aria-hidden="true">·</span>
          <label class="taal">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></g></svg>
            <select id="taal" aria-label="Choose language"></select>
          </label>
          <span class="stip" aria-hidden="true">·</span>
          <span class="versie" id="versie">dev</span>
          <button class="ververs" id="ververs" type="button" aria-label="Update to the latest version" title="Update to the latest version">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5V9h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </footer>
        <div class="doneerpaneel" id="doneerPaneel" hidden></div>
        <div class="meermenu" id="meerMenu" role="menu" aria-labelledby="meerKnop" hidden>
          <button type="button" role="menuitem" id="exportKnop" tabindex="-1">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 13.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="exportTekst">Export</span>
          </button>
          <button type="button" role="menuitem" id="importKnop" tabindex="-1">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3.5V15M7.5 10.5 12 15l4.5-4.5M5 13.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="importTekst">Import</span>
          </button>
          <button type="button" role="menuitem" id="wisKnop" class="gevaar" tabindex="-1">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5l1-12.5M10.5 11v6M13.5 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="wisTekst">Erase everything</span>
          </button>
        </div>
        <div class="bevestig" id="bevestig" role="alertdialog" aria-modal="true" aria-labelledby="bevestigTitel" aria-describedby="bevestigTekst" hidden>
          <p class="bevestig-titel" id="bevestigTitel">Erase everything?</p>
          <p class="bevestig-tekst" id="bevestigTekst">This can’t be undone. Export first if you want to keep something.</p>
          <div class="bevestig-knoppen">
            <button type="button" class="bevestig-nee" id="wisNee">Cancel</button>
            <button type="button" class="bevestig-ja" id="wisJa">Erase all</button>
          </div>
          <button type="button" class="bevestig-export" id="wisExport">Export first</button>
        </div>
        <input class="sr" type="file" id="importBestand" accept=".json,.memo,.txt,application/json,text/plain,application/octet-stream" tabindex="-1" aria-hidden="true">
      </section>

      <!-- Een blaadje: gewoon schrijven -->
      <section class="pagina blad" id="blad" hidden>
        <div class="kop kop-leeg" aria-hidden="true"></div>
        <label class="sr" for="tekst" id="tekstLabel">Page</label>
        <textarea class="lijnen tekst" id="tekst" dir="auto" spellcheck="true" autocapitalize="sentences" autocomplete="off"></textarea>
        <div class="bladvoet">
          <button class="terug" id="terug" type="button" aria-label="Back to your pages" title="Back to your pages">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M19 12H5.5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </section>

    </div>
    <div class="spiraal" aria-hidden="true"></div>
    <div class="strookje" id="strookje" role="status" aria-live="polite">
      <span id="strookjeTekst"></span>
      <button type="button" id="ongedaan">Undo</button>
    </div>
    <p class="melding" id="melding" role="alert"></p>
  </div>

</main>
<noscript><p class="noscript">Notitieboekje needs JavaScript to keep your notes on this device.</p></noscript>
</body>
</html>
